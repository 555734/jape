name: test

on:
  push:
  pull_request:

env:
  GODOT_VERSION: "4.5"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Godot を用意
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: EOSG(通信対戦のプラグイン)を取得
        run: bash tools/eos/fetch_eosg.sh linux
      - name: 素材の読み込み(import)
        run: godot --headless --path . --import
      - name: テスト
        run: godot --headless --path . -s res://tests/run_tests.gd
      - name: CPU同士の自動対戦(3試合、最後まで終わり詰まらないこと)
        run: |
          for seed in 1 2 3; do
            godot --headless --path . --fixed-fps 60 --disable-vsync -- --sim --seed=$seed | grep -E "ROUND|SIM|STUCK|TIMEOUT"
            test ${PIPESTATUS[0]} -eq 0
          done
      - name: 乱数操作の耐久テスト(10分ぶん。位置が壊れない・消えない・画面外に出ない)
        run: godot --headless --path . --fixed-fps 60 --disable-vsync -- --soak=600 --seed=7 | grep -E "SOAK"; test ${PIPESTATUS[0]} -eq 0
      - name: 通信対戦の自動試合(2つのプロセスをUDPでつなぎ、遅延・ロスありで最後まで同期がずれないこと)
        run: |
          godot --headless --path . -- --host=24680 --sim --net-lag=40 --net-jitter=20 --net-loss=0.03 > host.log 2>&1 &
          sleep 2
          join_status=0
          godot --headless --path . -- --join=127.0.0.1:24680 --sim --net-lag=40 --net-jitter=20 --net-loss=0.03 > join.log 2>&1 || join_status=$?
          host_status=0
          wait %1 || host_status=$?
          grep -E "NET|SIM" host.log join.log
          test $host_status -eq 0 && test $join_status -eq 0
          test "$(grep -h 'SIM RESULT' host.log join.log | sed 's/.*checksum=//' | sort -u | wc -l)" -eq 1
