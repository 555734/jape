name: android

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot を用意
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: エクスポートテンプレートのキャッシュ
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-android
      - name: エクスポートテンプレートを用意(Android分だけ)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          d=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$d"
          unzip -q -j tpl.tpz 'templates/android_*' 'templates/version.txt' -d "$d"
          rm tpl.tpz
      - name: Android SDK と署名鍵の設定
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: 素材の読み込み(import)
        run: godot --headless --path . --import
      - name: APK を作る
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/jape.apk
          test -s build/android/jape.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jape-android-${{ github.sha }}
          path: build/android/jape.apk
          retention-days: 14
