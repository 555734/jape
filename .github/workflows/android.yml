name: android

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Godot を用意
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: エクスポートテンプレートのキャッシュ
        id: tpl
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-android
      - name: エクスポートテンプレートを用意(Android分だけ)
        if: steps.tpl.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          d=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$d"
          unzip -q -j tpl.tpz 'templates/android_*' 'templates/version.txt' -d "$d"
          rm tpl.tpz
      - name: Android SDK と署名鍵の設定
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Play 提出に必要な Android 16 SDK を用意
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.1.0"
      - name: EOSG(通信対戦のプラグイン)を取得
        run: bash tools/eos/fetch_eosg.sh linux android
      - name: EOS の認証情報を GitHub Secrets から入れる(リポジトリには入れない)
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: bash tools/eos/write_secrets.sh
      - name: Android のビルドテンプレート(Gradle)を用意し、EOS SDK を組み込む
        env:
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
        run: |
          d=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p android/build
          unzip -q "$d/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          python3 tools/eos/patch_android.py android/build
      - name: 素材の読み込み(import)
        run: godot --headless --path . --import
      - name: APK を作る
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/jape.apk
          test -s build/android/jape.apk
          # EOS が組み込まれたか確かめる
          unzip -l build/android/jape.apk | grep -E "libEOSSDK.so|libeosg" 
      - uses: actions/upload-artifact@v4
        with:
          name: jape-android-${{ github.sha }}
          path: build/android/jape.apk
          retention-days: 14
      - name: Play 内部テスト用の認証情報を確認
        id: play_ready
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          missing=""
          for v in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_ALIAS ANDROID_UPLOAD_KEYSTORE_PASSWORD PLAY_SERVICE_ACCOUNT_JSON_BASE64; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Play 内部テストへの送信をスキップします。未登録の Secrets:$missing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Play 内部テスト用の署名済み AAB を作る
        if: steps.play_ready.outputs.enabled == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.jks
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          chmod 600 "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          sed -i "s/^version\/code=.*/version\/code=$build_number/" export_presets.cfg
          godot --headless --path . --export-release "Android Play" build/android/jape.aab
          test -s build/android/jape.aab
          unzip -l build/android/jape.aab | grep -E "libEOSSDK.so|libeosg"
          jarsigner -verify build/android/jape.aab
      - uses: actions/upload-artifact@v4
        if: steps.play_ready.outputs.enabled == 'true'
        with:
          name: jape-play-aab-${{ github.sha }}
          path: build/android/jape.aab
          retention-days: 14
      - uses: actions/setup-python@v5
        if: steps.play_ready.outputs.enabled == 'true'
        with:
          python-version: '3.11'
      - name: Google Play 内部テストへ送信
        if: steps.play_ready.outputs.enabled == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-service-account.json
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          python -m pip install google-auth requests
          python tools/store/upload_play_internal.py com.jape.game build/android/jape.aab
