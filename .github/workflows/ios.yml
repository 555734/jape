name: ios

# push のたびに iOS 版がビルドできるか確かめる(署名なし)。
# Apple の Secrets(docs/SETUP_IOS.md)がそろった手動実行だけ、署名して TestFlight へ送る。
on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  ios:
    runs-on: macos-26
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Apple の Secrets がそろっているか確認
        id: signing
        run: |
          xcodebuild -version
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          missing=""
          for v in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Apple の Secrets が未登録のため、署名なしのビルド確認だけ行います(TestFlight には送りません):$missing"
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
      - name: Godot とテンプレートを用意
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          d="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$d"
          unzip -q -j tpl.tpz 'templates/ios.zip' 'templates/version.txt' -d "$d"
          rm tpl.tpz
      - name: EOSG(通信対戦のプラグイン)を取得
        run: bash tools/eos/fetch_eosg.sh macos ios
      - name: EOS の認証情報を GitHub Secrets から入れる(リポジトリには入れない)
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: bash tools/eos/write_secrets.sh
      - name: 署名用の証明書とプロファイルを入れる
        if: steps.signing.outputs.enabled == 'true'
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$IOS_CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/app.mobileprovision
          UUID=$(security cms -D -i $RUNNER_TEMP/app.mobileprovision | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $RUNNER_TEMP/app.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> $GITHUB_ENV
      - name: Xcode プロジェクトを出力
        run: |
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          TEAM="${APPLE_TEAM_ID:-ABCDE12345}"   # 署名なしの確認では仮のチームIDで出力する
          sed -i '' \
            -e "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$TEAM\"/" \
            -e "s/^application\/provisioning_profile_uuid_release=.*/application\/provisioning_profile_uuid_release=\"${PROFILE_UUID:-}\"/" \
            -e "s/^application\/version=.*/application\/version=\"$BUILD\"/" \
            export_presets.cfg
          "$GODOT" --headless --path . --import
          mkdir -p build/ios
          "$GODOT" --headless --path . --export-release "iOS" build/ios/jape.ipa
          ls build/ios
          # EOS のフレームワークが Xcode プロジェクトに入ったか確かめる
          grep -c "EOSSDK" build/ios/jape.xcodeproj/project.pbxproj
      - name: ビルドできるか確認(署名なし)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          cd build/ios
          xcodebuild -project jape.xcodeproj -scheme jape -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath $RUNNER_TEMP/dd \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -30
          test ${PIPESTATUS[0]} -eq 0
          # EOS SDK(動的フレームワーク)がアプリに同梱されていないと、起動した瞬間に落ちる
          app=$(find $RUNNER_TEMP/dd -name "*.app" -type d | head -1)
          ls "$app/Frameworks"
          test -d "$app/Frameworks/EOSSDK.framework"
      - name: アーカイブと IPA 作成
        if: steps.signing.outputs.enabled == 'true'
        run: |
          cd build/ios
          xcodebuild -project jape.xcodeproj -scheme jape -configuration Release \
            -archivePath $RUNNER_TEMP/jape.xcarchive -destination 'generic/platform=iOS' archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CODE_SIGN_IDENTITY="iPhone Distribution: Masaharu Sasabe (6TGM565HX8)"
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.jape.game</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          EOT
          ls "$RUNNER_TEMP/jape.xcarchive/Products/Applications/"*.app/Frameworks
          test -d "$(ls -d $RUNNER_TEMP/jape.xcarchive/Products/Applications/*.app)/Frameworks/EOSSDK.framework"
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/jape.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist -exportPath $RUNNER_TEMP/ipa
          ls $RUNNER_TEMP/ipa
      - name: TestFlight へアップロード
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/ipa/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
